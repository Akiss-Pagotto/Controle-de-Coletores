function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function now(){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(s){if(!s)return '';let a=String(s).slice(0,10).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function recordDateTime(r){
 const d=String(r?.data||'').trim(); const h=String(r?.hora||'00:00:00').trim();
 let y,m,day;
 if(/^\d{4}-\d{2}-\d{2}$/.test(d)){[y,m,day]=d.split('-').map(Number)}
 else if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)){[day,m,y]=d.split('/').map(Number)}
 else return -Infinity;
 const hm=h.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
 const hh=hm?Number(hm[1]):0, mm=hm?Number(hm[2]):0, ss=hm&&hm[3]?Number(hm[3]):0;
 return new Date(y,m-1,day,hh,mm,ss).getTime();
}
function sortRecords(a){
 return [...a].sort((x,y)=>{
  const xt=recordDateTime(x), yt=recordDateTime(y);
  if(yt!==xt) return yt-xt;
  const xi=Number(x?.id), yi=Number(y?.id);
  if(Number.isFinite(xi)&&Number.isFinite(yi)&&xi!==yi) return yi-xi;
  return String(y.id||'').localeCompare(String(x.id||''));
 });
}
function recordKey(r){return [r.matricula,r.usuario,r.coletor,r.status,r.tipo,r.data,r.hora,r.identificacao].map(v=>String(v??'').trim().toLowerCase()).join('|')}
function hasRecordInfo(r){return ['matricula','usuario','coletor','status','tipo','data','hora'].some(k=>String(r?.[k]??'').trim()!=='')}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}}
function setCloudBusy(v){cloudBusy=v;document.body.classList.toggle('cloudBusy',v)}
async function loadCloudDB(){
 if(!CLOUD_ENABLED) throw new Error('Supabase não está disponível nesta página.');
 const allRecords=[];
 const PAGE=1000;
 // Busca o histórico inteiro em páginas. 1.000 é apenas o tamanho da página, nunca o limite do histórico.
 for(let from=0;;from+=PAGE){
  const {data,error}=await sb.from('lancamentos')
   .select('id,matricula,usuario,coletor,status,tipo,data,hora,identificacao')
   .order('id',{ascending:false})
   .range(from,from+PAGE-1);
  if(error) throw error;
  const rows=Array.isArray(data)?data:[];
  allRecords.push(...rows);
  if(rows.length<PAGE) break;
 }
 const [u,b]=await Promise.all([
  sb.from('usuarios').select('*').order('usuario',{ascending:true}),
  sb.from('coletores').select('*').order('identificacao',{ascending:true})
 ]);
 if(u.error) throw u.error;
 if(b.error) throw b.error;
 const cloudRecords=allRecords.map(x=>({id:x.id,matricula:x.matricula||'',usuario:x.usuario||'',coletor:x.coletor||'',status:x.status||'BOM',tipo:x.tipo||'',data:x.data||'',hora:x.hora||'',identificacao:x.identificacao||''}));
 return {records:sortRecords(cloudRecords),users:(u.data||[]).map(x=>({matricula:x.matricula||'',usuario:x.usuario||''})),base:(b.data||[]).map(x=>({identificacao:x.identificacao||'',numeroSerie:x.numero_serie||''}))};
}

async function syncUsers(){if(!CLOUD_ENABLED){saveLocal();return}setCloudBusy(true);try{let {error}=await sb.from('usuarios').delete().neq('matricula','__IMPOSSIVEL__');if(error)throw error;if(db.users.length){let {error:e}=await sb.from('usuarios').insert(db.users.map(x=>({matricula:String(x.matricula||'').trim(),usuario:String(x.usuario||'').trim()})).filter(x=>x.matricula));if(e)throw e}saveLocal()}catch(e){console.error(e);setNotice('error','Não foi possível atualizar a base de usuários no banco.')}finally{setCloudBusy(false)}}
async function syncBase(){if(!CLOUD_ENABLED){saveLocal();return}setCloudBusy(true);try{let {error}=await sb.from('coletores').delete().neq('numero_serie','__IMPOSSIVEL__');if(error)throw error;if(db.base.length){let {error:e}=await sb.from('coletores').insert(db.base.map(x=>({identificacao:String(x.identificacao||'').trim(),numero_serie:String(x.numeroSerie||'').trim()})).filter(x=>x.numero_serie));if(e)throw e}saveLocal()}catch(e){console.error(e);setNotice('error','Não foi possível atualizar a base de coletores no banco.')}finally{setCloudBusy(false)}}
async function insertRecord(record){
 const localRecord={...record,id:record.id||('local_'+Date.now()+'_'+Math.random().toString(36).slice(2))};
 if(!db.records)db.records=[];
 db.records=sortRecords([localRecord,...db.records]);
 saveLocal();
 if(!CLOUD_ENABLED)return localRecord;
 setCloudBusy(true);
 try{
  const {data,error}=await sb.from('lancamentos').insert({matricula:localRecord.matricula,usuario:localRecord.usuario,coletor:localRecord.coletor,status:localRecord.status,tipo:localRecord.tipo,data:localRecord.data,hora:localRecord.hora,identificacao:localRecord.identificacao||''}).select().single();
  if(error)throw error;
  const saved={...localRecord,id:data.id};
  db.records=db.records.map(r=>r.id===localRecord.id?saved:r);
  saveLocal();
  return saved;
 }catch(e){console.error('Supabase indisponível; lançamento mantido localmente.',e);return localRecord}
 finally{setCloudBusy(false)}
}
async function syncRecords(){if(!CLOUD_ENABLED){saveLocal();return}setCloudBusy(true);try{let {error}=await sb.from('lancamentos').delete().gte('id',0);if(error)throw error;if(db.records.length){let rows=db.records.filter(hasRecordInfo).map(r=>({matricula:r.matricula,usuario:r.usuario,coletor:r.coletor,status:r.status,tipo:r.tipo,data:r.data,hora:r.hora,identificacao:r.identificacao||''}));for(let i=0;i<rows.length;i+=500){let {error:e}=await sb.from('lancamentos').insert(rows.slice(i,i+500));if(e)throw e}}saveLocal()}catch(e){console.error(e);setNotice('error','Não foi possível sincronizar o histórico com o banco.')}finally{setCloudBusy(false)}}
async function syncAll(){await syncUsers();await syncBase();await syncRecords()}

function latestForCollector(c){return db.records.filter(r=>String(r.coletor||'').trim().toLowerCase()===String(c||'').trim().toLowerCase()).sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0]||null}
function latestForPersonCollector(m,c){return db.records.filter(r=>String(r.matricula||'').trim()===String(m||'').trim()&&String(r.coletor||'').trim().toLowerCase()===String(c||'').trim().toLowerCase()).sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0]||null}
function baseForCode(c){let q=String(c||'').trim().toLowerCase();return db.base.find(x=>String(x.numeroSerie||'').trim().toLowerCase()===q||String(x.identificacao||'').trim().toLowerCase()===q)}
function pairState(r){let last=latestForPersonCollector(r.matricula,r.coletor);return last&&last.tipo==='Devolução'?'returned':'open'}
function updateStatusFromCollector(){let last=latestForPersonCollector(form.matricula,form.coletor);if(form.tipo==='Devolução'){form.status=last&&last.tipo==='Retirada'?last.status:'BOM'}else{form.status='BOM'}}
function identifyCollector(){let b=baseForCode(form.coletor);if(b){form.coletor=String(b.numeroSerie||form.coletor).trim();form.identificacao=b.identificacao||''}else{form.identificacao=''}return b}

 const sourceRecords=db.records.filter(hasRecordInfo);
 const stats={total:sourceRecords.length,ret:sourceRecords.filter(r=>r.tipo==='Retirada').length,dev:sourceRecords.filter(r=>r.tipo==='Devolução').length,av:sourceRecords.filter(r=>r.status==='AVARIADO').length};
 const filtered=sourceRecords.filter(r=>{let q=query.toLowerCase().trim();let hit=!q||Object.values(r).some(v=>String(v??'').toLowerCase().includes(q));return hit&&(!filters.tipo||r.tipo===filters.tipo)&&(!filters.status||r.status===filters.status)&&(!filters.situacao||((pairState(r)==='returned'?'Devolvido':'Pendente')===filters.situacao))&&(!filters.identificacao||r.identificacao===filters.identificacao)&&(!filters.de||r.data>=filters.de)&&(!filters.ate||r.data<=filters.ate)});
 root.innerHTML=`<div class="app"><aside><div class="brand"><div class="brandIcon">✓</div><div><b>Controle</b><span>de Coletores</span></div></div><nav><button class="${tab==='lancamento'?'active':''}" data-tab="lancamento">＋ Lançamento</button><button class="${tab==='historico'?'active':''}" data-tab="historico">◷ Histórico</button><button class="${tab==='base'?'active':''}" data-tab="base">⚙ Atualizar base</button></nav><div class="sideInfo"><span>Base atual</span><strong>${db.records.length.toLocaleString('pt-BR')}</strong><small>${db.users.length} usuários · ${db.base.length} coletores</small></div></aside><main><header><div><h1>${tab==='lancamento'?'Novo lançamento':tab==='historico'?'Histórico de lançamentos':'Atualizar base de dados'}</h1><p>${tab==='lancamento'?'Registre uma retirada ou devolução.':tab==='historico'?'Consulte os registros do mais recente para o mais antigo.':'Gerencie usuários, coletores e faça backup da base.'}</p></div><div class="headerStats"><span><b>${stats.total.toLocaleString('pt-BR')}</b> registros</span><span><b>${stats.ret.toLocaleString('pt-BR')}</b> retiradas</span><span><b>${stats.dev.toLocaleString('pt-BR')}</b> devoluções</span></div></header>${notice?`<div class="notice ${notice.type}"><span>${notice.type==='ok'?'✓':'⚠'} ${esc(notice.text)}</span><button class="closeNotice">×</button></div>`:''}${tab==='lancamento'?formView(stats):tab==='historico'?historyView(filtered):baseView()}${selected?modal():''}</main></div>`;
 bind();
}
function formView(stats){let isDev=form.tipo==='Devolução';return `<section class="content"><div class="card formCard"><div class="cardTitle"><div><h2>Registrar movimentação</h2><p>Matrícula e coletor são validados contra a base. A identificação é automática.</p></div><span class="live">● HORA AO VIVO <span id="liveClock" class="clock">${form.hora}</span></span></div><div class="grid"><label>Matrícula<input id="mat" inputmode="numeric" autocomplete="off" value="${esc(form.matricula)}" placeholder="Digite os números"></label><label>Usuário<input id="user" value="${esc(form.usuario)}" readonly class="readonly" placeholder="Preenchido automaticamente"></label><label>Coletor / Nº série<input id="col" autocomplete="off" value="${esc(form.coletor)}" placeholder="Código do coletor"></label><label>Identificação<input value="${esc(form.identificacao)}" readonly class="readonly" placeholder="Identificada pela base"></label><label>Status<select id="status" ${isDev?'disabled class="disabled"':''}><option value="BOM" ${form.status==='BOM'?'selected':''}>BOM</option><option value="AVARIADO" ${form.status==='AVARIADO'?'selected':''}>AVARIADO</option></select></label><label>Tipo<select id="tipo"><option value="" ${!form.tipo?'selected':''}>Selecione...</option><option value="Retirada" ${form.tipo==='Retirada'?'selected':''}>Retirada</option><option value="Devolução" ${form.tipo==='Devolução'?'selected':''}>Devolução</option></select></label><label>Data<input id="date" type="date" value="${form.data}"></label><label>Hora<input value="${form.hora}" readonly class="readonly" id="hour"></label></div><div class="actions"><button class="primary" id="register">＋ Registrar lançamento</button><button class="secondary" id="clearForm">Limpar</button></div></div><div class="cards"><div><span>Histórico</span><b>${stats.total.toLocaleString('pt-BR')}</b><small>registros disponíveis</small></div><div><span>Avariados</span><b>${stats.av}</b><small>registros com avaria</small></div><div><span>Usuár function historyView(rows){return `<section class="content"><div class="card filters"><div class="filterTop"><div class="search">⌕<input id="search" value="${esc(query)}" placeholder="Pesquisar em todos os campos..."></div><button class="secondary" id="clearFilters">Limpar filtros</button></div><div class="filterGrid"><label>Tipo<select id="fTipo"><option value="">Todos</option><option ${filters.tipo==='Retirada'?'selected':''}>Retirada</option><option ${filters.tipo==='Devolução'?'selected':''}>Devolução</option></select></label><label>Status<select id="fStatus"><option value="">Todos</option><option ${filters.status==='BOM'?'selected':''}>BOM</option><option ${filters.status==='AVARIADO'?'selected':''}>AVARIADO</option></select></label><label>Situação<select id="fSituacao"><option value="">Todas</option><option value="Devolvido" ${filters.situacao==='Devolvido'?'selected':''}>Devolvido</option><option value="Pendente" ${filters.situacao==='Pendente'?'selected':''}>Pendente</option></select></label><label>Identificação<select id="fIdent"><option value="">Todas</option>${db.base.map(x=>`<option value="${esc(x.identificacao)}" ${filters.identificacao===x.identificacao?'selected':''}>${esc(x.identificacao)}</option>`).join('')}</select></label><label>De <input id="fDe" type="date" value="${filters.de}"></label><label>Até <input id="fAte" type="date" value="${filters.ate}"></label><div class="filterActions"><button class="secondary" id="applyFilters">Aplicar</button></div></div><div class="resultLine"><b>${rows.length.toLocaleString('pt-BR')}</b> registros encontrados · <b>data e hora exibidas conforme o lançamento</b></div></div><div class="card tableCard">${table(rows)}</div></section>`}
function table(rows){rows=rows.filter(hasRecordInfo);return `<div class="tableWrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Matrícula</th><th>Usuário</th><th>Coletor</th><th>Identificação</th><th>Status</th><th>Tipo</th><th>Situação</th></tr></thead><tbody>${rows.length?rows.map(r=>{let st=pairState(r);return `<tr data-id="${r.id||''}"><td>${fmt(r.data)}</td><td>${esc(r.hora)}</td><td><b>${esc(r.matricula)}</b></td><td><span class="state ${st==='returned'?'good':'bad'}">${esc(r.usuario)}</span></td><td>${esc(r.coletor)}</td><td>${esc(r.identificacao||'—')}</td><td><span class="pill ${r.status==='AVARIADO'?'bad':'good'}">${esc(r.status)}</span></td><td><span class="type ${r.tipo==='Retirada'?'out':'in'}">${esc(r.tipo)}</span></td><td><span class="pill ${st==='returned'?'good':'bad'}">${st==='returned'?'Devolvido':'Pendente'}</span></td></tr>`}).join(''):`<tr><td colspan="9" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`}
function baseView(){return `<section class="content"><div class="baseGrid"><div class="card baseCard"><h2>Usuários</h2><p>${db.users.length} registros. Edite diretamente e salve.</p><div class="toolbar"><button class="primary" id="addUser">＋ Adicionar</button><button class="secondary fileBtn">Importar CSV<input id="usersFile" type="file" accept=".csv,.txt"></button><button class="secondary" id="exportUsers">Exportar CSV</button></div><div class="miniTable"><table><thead><tr><th>Matrícula</th><th>Usuário</th><th></th></tr></thead><tbody>${db.users.map((u,i)=>`<tr><td><input data-u-m="${i}" value="${esc(u.matricula)}"></td><td><input data-u-n="${i}" value="${esc(u.usuario)}"></td><td><button class="danger" data-del-user="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div></div><div class="card baseCard"><h2>Base de coletores</h2><p>${db.base.length} coletores. O código do coletor identifica a descrição automaticamente. As alterações são sincronizadas com o banco de dados.</p><div class="toolbar"><button class="primary" id="addBase">＋ Adicionar</button><button class="secondary fileBtn">Importar CSV<input id="baseFile" type="file" accept=".csv,.txt"></button><button class="secondary" id="exportBase">Exportar CSV</button></div><div class="miniTable"><table><thead><tr><th>Identificação</th><th>Nº série / código</th><th></th></tr></thead><tbody>${db.base.map((b,i)=>`<tr><td><input data-b-i="${i}" value="${esc(b.identificacao)}"></td><td><input data-b-s="${i}" value="${esc(b.numeroSerie)}"></td><td><button class="danger" data-del-base="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div></div></div><div class="card baseCard" style="margin-top:18px"><h2>Histórico de lançamentos</h2><p>${db.records.filter(hasRecordInfo).length.toLocaleString('pt-BR')} lançamentos registrados. Exporte ou importe o histórico em CSV.</p><div class="toolbar"><button class="primary" id="exportHistory">Exportar histórico CSV</button><button class="secondary fileBtn">Importar histórico CSV<input id="historyFile" type="file" accept=".csv,.txt"></button></div><div class="help">O CSV do histórico utiliza as colunas <b>matricula,usuario,coletor,status,tipo,data,hora,identificacao</b>. A importação adiciona os lançamentos à base atual, sem apagar o histórico existente.</div></div><div class="card baseCard" style="margin-top:18px"><h2>Backup e atualização completa</h2><p>Os lançamentos, usuários e coletores ficam salvos no banco de dados central. O backup continua disponível para segurança.</p><div class="toolbar"><button class="primary" id="exportAll">Exportar backup JSON</button><button class="secondary fileBtn">Importar backup JSON<input id="backupFile" type="file" accept=".json"></button><button class="danger" id="resetBase">Restaurar dados originais</button></div><div class="help">Importar CSV de usuários: duas colunas, <b>matricula,usuario</b>. Importar CSV de coletores: duas colunas, <b>identificacao,numeroSerie</b>. O sistema aceita ; ou , como separador.</div></div></section>`}
function modal(){return `<div class="modalBack" id="modalBack"><div class="modal"><div class="modalHead"><div><span class="eyebrow">DETALHE DO LANÇAMENTO</span><h2>${esc(selected.tipo)}</h2></div><button id="closeModal">×</button></div><div class="detailGrid">${[['Matrícula',selected.matricula],['Usuário',selected.usuario],['Coletor',selected.coletor],['Identificação',selected.identificacao||'—'],['Status',selected.status],['Tipo',selected.tipo],['Data',fmt(selected.data)],['Hora',selected.hora]].map(x=>`<div><span>${x[0]}</span><b>${esc(x[1]||'—')}</b></div>`).join('')}</div></div></div>`}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;notice=null;render()});
 document.querySelector('.closeNotice')?.addEventListener('click',()=>{notice=null;render()});
 if(tab==='lancamento'){
  const mat=document.getElementById('mat'),col=document.getElementById('col'),type=document.getElementById('tipo'),status=document.getElementById('status');
  mat.oninput=()=>{form.matricula=mat.value.replace(/\D/g,'');let u=db.users.find(x=>String(x.matricula).trim()===form.matricula.trim());form.usuario=u?u.usuario:'';mat.value=form.matricula;document.getElementById('user').value=form.usuario};
  mat.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();col.focus()}};
  col.oninput=()=>{form.coletor=col.value.trim();let b=identifyCollector();updateStatusFromCollector();document.querySelector('.grid label:nth-child(4) input').value=form.identificacao;let st=document.getElementById('status');if(st)st.value=form.status};
  col.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();type.focus()}};
  type.onchange=()=>{form.tipo=type.value;updateStatusFromCollector();let st=document.getElementById('status');if(st)st.value=form.status;st?.toggleAttribute('disabled',form.tipo==='Devolução');st?.classList.toggle('disabled',form.tipo==='Devolução')};
  status?.addEventListener('change',()=>{if(form.tipo!=='Devolução'){form.status=status.value}});
  document.getElementById('date').onchange=e=>form.data=e.target.value;
  document.getElementById('register').onclick=register;
  document.getElementById('clearForm').onclick=()=>{resetForm();render()};
  document.getElementById('goHistory').onclick=()=>{tab='historico';render()};
  let timer=setInterval(()=>{if(tab!=='lancamento'){clearInterval(timer);return}form.hora=now();let el=document.getElementById('liveClock');if(el)el.textContent=form.hora;let h=document.getElementById('hour');if(h)h.value=form.hora},500);
 }
 if(tab==='historico'){
  document.getElementById('search').oninput=e=>{query=e.target.value;render();setTimeout(()=>{let x=document.getElementById('search');if(x){x.focus();x.setSelectionRange(query.length,query.length)}},0)};
  document.getElementById('applyFilters').onclick=()=>{filters={tipo:document.getElementById('fTipo').value,status:document.getElementById('fStatus').value,situacao:document.getElementById('fSituacao').value,identificacao:document.getElementById('fIdent').value,de:document.getElementById('fDe').value,ate:document.getElementById('fAte').value};render()};
  document.getElementById('clearFilters').onclick=()=>{query='';filters={tipo:'',status:'',situacao:'',de:'',ate:'',identificacao:''};render()};
 }
 if(tab==='base')bindBase();
 document.querySelectorAll('tbody tr[data-id]').forEach(tr=>tr.ondblclick=()=>{selected=db.records.find(r=>String(r.id||'')===tr.dataset.id)||null;if(selected)render()});
 document.getElementById('closeModal')?.addEventListener('click',()=>{selected=null;render()});
 document.getElementById('modalBack')?.addEventListener('click',e=>{if(e.target.id==='modalBack'){selected=null;render()}});
}
async function register(){
  if(!form.matricula)return setNotice('error','Preencha a matrícula.');
  if(!form.usuario)return setNotice('error','Matrícula não encontrada na base de usuários.');
  if(!form.coletor)return setNotice('error','Preencha o código/número do coletor.');
  let b=identifyCollector();
  if(!b)return setNotice('error','Coletor não encontrado na base. Vá em “Atualizar base” e confira o número de série/código.');
  if(!form.tipo)return setNotice('error','Selecione Retirada ou Devolução.');
  if(form.tipo==='Devolução'){
    const lastPerson=latestForPersonCollector(form.matricula,form.coletor);
    if(!lastPerson||lastPerson.tipo!=='Retirada')return setNotice('error','Esta pessoa não possui uma retirada pendente deste coletor.');
    form.status=lastPerson.status||'BOM';
  }else if(!['BOM','AVARIADO'].includes(form.status))return setNotice('error','Selecione o status da retirada.');

  const stamp=new Date();
  form.data=form.data||today();
  form.hora=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(stamp);
  const record={...form};
  notice={type:'ok',text:'Salvando lançamento...'};
  render();

  try{
    const saved=await insertRecord(record);
    const normalized={...record,...saved};
    db.records=sortRecords([normalized,...db.records.filter(r=>String(r.id||'')!==String(normalized.id||''))]);
    saveLocal();
    query='';
    filters={tipo:'',status:'',situacao:'',de:'',ate:'',identificacao:''};
    resetForm();
    tab='lancamento';
    notice={type:'ok',text:'Lançamento salvo com sucesso. Pronto para o próximo lançamento.'};
    render();
  }catch(e){
    console.error('Erro ao registrar lançamento:',e);
    notice={type:'error',text:'O lançamento não foi salvo. Verifique a conexão com o banco.'};
    render();
  }
}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return [];let sep=lines[0].includes(';')?';':',';let rows=lines.map(line=>line.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')));let head=rows.shift().map(x=>x.toLowerCase());return rows}
function download(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(rows,heads){return [heads.join(';'),...rows.map(r=>heads.map(h=>`"${String(r[h]??'').replaceAll('"','""')}"`).join(';'))].join('\n')}
function bindBase(){
 document.getElementById('addUser').onclick=async()=>{db.users.unshift({matricula:'',usuario:''});await syncUsers();render()};
 document.getElementById('addBase').onclick=async()=>{db.base.unshift({identificacao:'',numeroSerie:''});await syncBase();render()};
 document.querySelectorAll('[data-u-m]').forEach(x=>x.onchange=async()=>{db.users[+x.dataset.uM].matricula=x.value.trim();await syncUsers()});
 document.querySelectorAll('[data-u-n]').forEach(x=>x.onchange=async()=>{db.users[+x.dataset.uN].usuario=x.value.trim();await syncUsers()});
 document.querySelectorAll('[data-b-i]').forEach(x=>x.onchange=async()=>{db.base[+x.dataset.bI].identificacao=x.value.trim();await syncBase()});
 document.querySelectorAll('[data-b-s]').forEach(x=>x.onchange=async()=>{db.base[+x.dataset.bS].numeroSerie=x.value.trim();await syncBase()});
 document.querySelectorAll('[data-del-user]').forEach(x=>x.onclick=async()=>{db.users.splice(+x.dataset.delUser,1);await syncUsers();render()});
 document.querySelectorAll('[data-del-base]').forEach(x=>x.onclick=async()=>{db.base.splice(+x.dataset.delBase,1);await syncBase();render()});
 document.getElementById('exportUsers').onclick=()=>download('usuarios.csv',csv(db.users,['matricula','usuario']),'text/csv');document.getElementById('exportBase').onclick=()=>download('coletores.csv',csv(db.base,['identificacao','numeroSerie']),'text/csv');
 document.getElementById('usersFile').onchange=e=>importCSV(e.target.files[0],'users');document.getElementById('baseFile').onchange=e=>importCSV(e.target.files[0],'base');
 document.getElementById('exportHistory').onclick=()=>download('historico-lancamentos.csv',csv(db.records.filter(hasRecordInfo),['matricula','usuario','coletor','status','tipo','data','hora','identificacao']),'text/csv;charset=utf-8');
 document.getElementById('historyFile').onchange=e=>importHistoryCSV(e.target.files[0]);
 document.getElementById('exportAll').onclick=()=>download('backup-controle-coletores.json',JSON.stringify(db,null,2),'application/json');document.getElementById('backupFile').onchange=e=>importBackup(e.target.files[0]);
 document.getElementById('resetBase').onclick=async()=>{if(confirm('Restaurar os dados originais? Isso substitui os dados atuais do banco.')){db={records:sortRecords(INITIAL_RECORDS.map(x=>({...x}))),users:INITIAL_USERS.map(x=>({...x})),base:INITIAL_BASE.map(x=>({...x}))};await syncAll();render()}};
}
function importCSV(file,kind){if(!file)return;let fr=new FileReader();fr.onload=async()=>{let rows=parseCSV(fr.result);if(kind==='users'){db.users=rows.map(r=>({matricula:r[0]||'',usuario:r[1]||''})).filter(x=>x.matricula||x.usuario);await syncUsers();setNotice('ok','Base de usuários atualizada no banco.')}else{db.base=rows.map(r=>({identificacao:r[0]||'',numeroSerie:r[1]||''})).filter(x=>x.identificacao||x.numeroSerie);await syncBase();setNotice('ok','Base de coletores atualizada no banco.')}};fr.readAsText(file,'UTF-8')}
function importHistoryCSV(file){if(!file)return;let fr=new FileReader();fr.onload=async()=>{let rows=parseCSV(fr.result);let imported=rows.map(r=>({matricula:r[0]||'',usuario:r[1]||'',coletor:r[2]||'',status:r[3]||'BOM',tipo:r[4]||'',data:r[5]||'',hora:r[6]||'',identificacao:r[7]||''})).filter(x=>x.matricula||x.usuario||x.coletor||x.data||x.hora);if(!imported.length)return setNotice('error','Nenhum lançamento válido encontrado no CSV.');db.records=sortRecords(imported);await syncRecords();db=await loadCloudDB();render();setNotice('ok',`${imported.length.toLocaleString('pt-BR')} lançamento(s) sincronizado(s) com o banco.`)};fr.readAsText(file,'UTF-8')}
function importBackup(file){if(!file)return;let fr=new FileReader();fr.onload=async()=>{try{let x=JSON.parse(fr.result);if(!x.records||!x.users||!x.base)throw Error();db=x;await syncAll();setNotice('ok','Backup sincronizado com o banco com sucesso.')}catch(e){console.error(e);setNotice('error','Arquivo de backup inválido ou não foi possível sincronizar.')}};fr.readAsText(file,'UTF-8')}
async function boot(){
 setCloudBusy(true);
 try{
  db=await loadCloudDB();
  saveLocal();
  notice=null;
  render();
 }catch(e){
  console.error('Falha ao carregar o Supabase:',e);
  db={records:[],users:[],base:[]};
  notice={type:'error',text:'Não foi possível carregar os dados do Supabase. O histórico local não será exibido para evitar misturar bases.'};
  render();
 }finally{setCloudBusy(false)}
}
boot();
</script></body></html>
